[project]
name = "fd-quant"
version = "0.1.0"
description = "寻数·柏讯量化能力线：先立契约（Rating / TargetWeights），后接计算面"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
    "numpy>=1.26",
]

# 传输层依赖单列：`fd_quant.compute` 七族模块只依赖 numpy/标准库（纯计算，
# 不取数、不联网、不调 LLM），故做离线回归或把它嵌进别的进程时不必装 fastmcp。
# 只有 `fd_quant.compute.server`（MCP 入口）需要它——装它才装得进 server
# 之前 pyproject 漏了这条，fresh install 后启动会 ModuleNotFoundError。
[project.optional-dependencies]
server = ["fastmcp>=3.4,<4"]
test = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fd_quant*"]

# 输出结构声明与契约 schema 是**运行时工件**：server 启动时读它们挂到
# tools/list 的 outputSchema 上。不随包分发的话，装出来的 wheel 会退化成
# "所有工具未声明输出结构"，而开发机上一切正常——这种只在发布后出现的差异
# 最难查。故包内保留一份副本（仓根 schemas/ 是权威副本，两者由测试钉住一致）。
[tool.setuptools.package-data]
fd_quant = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `external`: 需要起子进程 / 占本地端口（或真实外部服务）；发布门用
# `-m "not external"` 跑，这些用例另行显式执行。与 law-bench 同约定。
markers = [
    "external: requires a subprocess/local port or a live service; excluded from the release gate",
]
