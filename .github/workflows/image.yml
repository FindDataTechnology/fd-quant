# Container image publish — GitHub Actions -> Tencent TCR personal edition.
# Standard channel per openspec tcr-image-pipeline / docs/IMAGE-RELEASE.md.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: finddata-business
  IMAGE_NAME: fd-quant
  DOCKERFILE: Dockerfile

jobs:
  # 计算面测试先跑：镜像是纯计算服务，测试不过就不该出片
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # server extras 必须装：selfcheck 与部分测试现在 import 上牌入口
          # （`fd_quant.server`），而 fastmcp 属传输层 extras。只装 [test] 会在
          # 测试期 ModuleNotFoundError —— 这正是"意图与事实分叉"被修好后暴露的
          # 真实依赖，不是测试写错了。
          pip install -e ".[test,server]"

      - name: Test suite
        run: python -m pytest tests/ -q

      - name: Surface selfcheck (manifest ↔ runtime)
        run: python scripts/selfcheck_surface.py --gen-check

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
